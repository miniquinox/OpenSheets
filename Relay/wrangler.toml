# The OpenSheets relay. Deploy is a one-time user step:
#   cd Relay && npm ci && npx wrangler deploy
# The SQLite-backed Durable Object class keeps this on the free plan.

name = "opensheets-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
RESPONSE_TIMEOUT_MS = "120000"

[[durable_objects.bindings]]
name = "SHARE_HUB"
class_name = "ShareHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareHub"]
