name: Performance

# The performance gate. Separate from `ci.yml` (A0's) on purpose: a benchmark job is slow, it is
# the only job that must not run beside anything else on the same runner, and it fails for reasons
# — a noisy machine — that must never block a correctness PR from merging.
#
# `Scripts/bench.sh` is the whole implementation. This file is scheduling and reporting.

on:
  push:
    branches: [main]
  # Nightly, and deliberately `--strict`. A scheduled run on a runner that is not also building a
  # PR is the closest thing CI has to an idle machine, so it is the one run where a wall-clock
  # regression is worth failing on. The PR lane below stays lenient on purpose: a timing gate that
  # goes red on a noisy neighbour is a gate everyone learns to ignore.
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    paths:
      - "Packages/OpenSheetsCore/**"
      - "Scripts/bench.sh"
      - "docs/perf/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:
    inputs:
      record_baseline:
        description: "Record a new baseline instead of comparing against the current one"
        type: boolean
        default: false
      strict:
        description: "Do not widen the timing gate for a loaded runner"
        type: boolean
        default: false

concurrency:
  # One at a time, and **never cancel a running benchmark**. Two of these on one runner measure
  # each other; `cancel-in-progress: true` would also throw away the only number the job exists
  # to produce.
  group: perf-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer

jobs:
  benchmark:
    name: Benchmarks and regression gate
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and machine
        run: |
          swift --version
          sysctl -n machdep.cpu.brand_string hw.model hw.ncpu 2>/dev/null || true
          uptime

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/OpenSheetsCore/.build
          key: perf-spm-${{ runner.os }}-${{ hashFiles('Packages/OpenSheetsCore/Package.resolved') }}
          restore-keys: perf-spm-${{ runner.os }}-

      # Building first, separately, keeps compilation out of the measured window. A run that
      # compiles while it benchmarks measures the compiler.
      - name: Build release
        working-directory: Packages/OpenSheetsCore
        run: swift build -c release --build-tests -Xswiftc -enable-testing

      # A hosted runner is quiet but not idle, and it is a VM sharing a host. `bench.sh` handles
      # that: it records the load, normalises timing metrics against a calibration kernel, and
      # widens the timing tolerance when the load average exceeds the core count. Counts and byte
      # sizes are gated strictly regardless, which is why they are the metrics worth writing.
      - name: Let the runner settle
        run: sleep 5

      - name: Run benchmarks
        id: bench
        env:
          OPENSHEETS_PERF_REVISION: ${{ github.sha }}
        run: |
          EXTRA=""
          if [[ "${{ inputs.record_baseline }}" == "true" ]]; then EXTRA="--record-baseline"; fi
          if [[ "${{ inputs.strict }}" == "true" || "${{ github.event_name }}" == "schedule" ]]; then
            EXTRA="$EXTRA --strict"
          fi
          echo "Scripts/bench.sh $EXTRA"
          Scripts/bench.sh $EXTRA

      # `if: always()` so a failing gate still uploads the numbers that failed it. A regression you
      # cannot look at is a regression you argue about.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          path: |
            docs/perf/latest.json
            docs/perf/baseline.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              latest = json.load(open("docs/perf/latest.json"))
          except FileNotFoundError:
              print("No `docs/perf/latest.json` — the benchmark lane did not produce one.")
              raise SystemExit(0)
          try:
              baseline = json.load(open("docs/perf/baseline.json"))
          except FileNotFoundError:
              baseline = {"metrics": {}}

          machine = latest.get("machine", {})
          print(f"## Performance — {latest.get('configuration')} on {machine.get('model') or machine.get('arch')}")
          print()
          print(f"Load {machine.get('normalizedLoad')}× {machine.get('cores')} cores · "
                f"calibration {latest.get('calibrationSeconds')} s · taken {latest.get('takenAt')}")
          print()
          print("| metric | value | budget | vs baseline | status |")
          print("| --- | ---: | ---: | ---: | --- |")

          def render(value, unit):
              if value is None:
                  return "—"
              if unit == "bytes":
                  for scale, suffix in ((1 << 30, "GB"), (1 << 20, "MB"), (1 << 10, "KB")):
                      if abs(value) >= scale:
                          return f"{value / scale:.1f} {suffix}"
                  return f"{value:.0f} B"
              if unit == "seconds":
                  return f"{value * 1000:.3f} ms"
              if unit == "ratio":
                  return f"{value:.3f}"
              return f"{value:,.0f}"

          for identifier, metric in sorted(latest.get("metrics", {}).items()):
              unit = metric.get("unit", "count")
              before = (baseline.get("metrics") or {}).get(identifier, {}).get("value")
              delta = "—"
              if before and metric.get("value") is not None:
                  change = (metric["value"] - before) / abs(before)
                  delta = f"{change:+.1%}"
              print(f"| `{identifier}` | {render(metric.get('value'), unit)} | "
                    f"{render(metric.get('budget'), unit)} | {delta} | {metric.get('status')} |")

          blocked = [k for k, v in latest.get("metrics", {}).items() if v.get("status") == "blocked"]
          if blocked:
              print()
              print(f"<details><summary>{len(blocked)} budget(s) not measurable yet</summary>")
              print()
              for identifier in sorted(blocked):
                  owner = latest["metrics"][identifier].get("owner") or "unowned"
                  print(f"- `{identifier}` — {owner}")
              print()
              print("</details>")
          PY

      - name: Explain a failure
        if: failure() && steps.bench.outcome == 'failure'
        run: |
          {
            echo
            echo "### The performance gate failed"
            echo
            echo "Counts and byte sizes are gated at 10%, wall-clock metrics at 20%, and the"
            echo "timing gate widens on a loaded runner. Before treating a timing regression as"
            echo "real, re-run this workflow — a hosted runner is a shared VM and a single noisy"
            echo "neighbour is enough. A **count** or **byte** regression is not noise; those"
            echo "moved 0.3% across five back-to-back local runs at 3x load."
            echo
            echo "If the change is a deliberate trade, record a new baseline:"
            echo '`Scripts/bench.sh --record-baseline` on an idle machine, or run this workflow'
            echo "with **record_baseline** checked, and say why in the commit message."
            echo
            echo "See \`docs/perf/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
