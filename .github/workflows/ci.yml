name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an Xcode bump is a deliberate commit rather than a surprise red build on a
  # runner-image refresh.
  DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer

jobs:
  package:
    name: Package build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/OpenSheetsCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/OpenSheetsCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Warnings as errors lives here rather than in Package.swift: `unsafeFlags` in a manifest
      # makes the package unusable as a dependency, and OpenSheets.xcodeproj depends on it by
      # path. See the note at the top of Package.swift.
      - name: Build
        working-directory: Packages/OpenSheetsCore
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        working-directory: Packages/OpenSheetsCore
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage

      - name: Coverage report
        working-directory: Packages/OpenSheetsCore
        run: |
          BINARY="$(swift build --show-bin-path)/OpenSheetsCorePackageTests.xctest/Contents/MacOS/OpenSheetsCorePackageTests"
          PROFILE="$(swift build --show-bin-path)/codecov/default.profdata"
          xcrun llvm-cov report "$BINARY" -instr-profile "$PROFILE" \
            -ignore-filename-regex='(Tests|\.build|checkouts)/' \
            | tee coverage.txt
          # SheetModel is the frozen interface seven agents compile against. A0's acceptance
          # criteria put its floor at 90%, and a drop below that is a regression in the one
          # part of the codebase nobody else can fix.
          COVERED=$(grep 'Sources/SheetModel' coverage.txt \
            | awk '{lines+=$8; missed+=$9} END {printf "%.2f", (lines-missed)*100.0/lines}')
          echo "SheetModel line coverage: ${COVERED}%"
          awk -v c="$COVERED" 'BEGIN { exit (c < 90) }' \
            || { echo "::error::SheetModel coverage ${COVERED}% is below the 90% floor"; exit 1; }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Packages/OpenSheetsCore/coverage.txt
          if-no-files-found: ignore

  release-tests:
    name: Release build and performance budgets
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The performance budgets in `BenchmarkTests` are written for optimised code. The debug
      # job above runs them against a slacker budget so a regression shows up there too, but
      # this is the run whose numbers mean something.
      - name: Test (release)
        working-directory: Packages/OpenSheetsCore
        run: swift test -c release -Xswiftc -enable-testing -Xswiftc -warnings-as-errors

  app:
    name: App build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build OpenSheets.app
        run: |
          xcodebuild build \
            -project OpenSheets.xcodeproj \
            -scheme OpenSheets \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | xcpretty || true
          # `xcodebuild | tee` masks the exit status, so check the log for the verdict.
          grep -q "BUILD SUCCEEDED" build.log || { tail -60 build.log; exit 1; }

      - name: Fail on any warning in our own sources
        run: |
          # Scoped to App/ and Packages/ so a warning inside a dependency does not block us,
          # while a warning we wrote does.
          if grep -E '^(/Users|/home|App/|Packages/).*warning: ' build.log \
             | grep -vE 'AppIntents\.framework|multiple matching destinations' | tee warnings.txt | grep -q .; then
            echo "::error::the app target built with warnings"
            cat warnings.txt
            exit 1
          fi
          echo "no warnings"

  lint:
    name: Format and lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The configurations in `.swiftformat` and `.swiftlint.yml` were verified against exactly
      # these versions. A newer one may add a rule that fails the build for reasons nobody
      # chose, so bumping them is a deliberate commit — run both locally first.
      - name: Install tools
        run: |
          brew install swiftformat swiftlint
          swiftformat --version   # verified against 0.58.6
          swiftlint version       # verified against 0.61.0

      - name: SwiftFormat (lint only)
        run: swiftformat --lint --reporter github-actions-log .

      - name: SwiftLint
        run: swiftlint lint --strict

  concurrency-check:
    name: Thread Sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # PLAN.md §10.8: all tests run under TSan. Everything in SheetModel is a Sendable value
      # type, so this should stay quiet — the moment it does not, something grew a reference.
      - name: Test under TSan
        working-directory: Packages/OpenSheetsCore
        run: swift test --sanitize thread --filter 'SheetModelTests|MiniZipTests'

  performance:
    name: Performance gate
    runs-on: macos-26
    timeout-minutes: 30
    # A7 owns `Scripts/bench.sh`, `docs/perf/baseline.json`, and the full `perf.yml` workflow.
    # This job exists so the gate has a home from Wave 0 and no-ops cleanly until then, rather
    # than being bolted on later and discovered to be broken.
    steps:
      - uses: actions/checkout@v4

      - name: Run benchmarks
        run: |
          if [[ -x Scripts/bench.sh ]]; then
            Scripts/bench.sh
          else
            echo "Scripts/bench.sh not present yet (A7 owns it) — skipping."
          fi
